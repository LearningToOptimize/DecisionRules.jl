version: 2
updates:
  # 1) Julia deps: updates Project.toml compat bounds (and may update Manifest if you commit it)
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"

  # 2) GitHub Actions: keeps actions like checkout/setup-julia/cache up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The v5→v7 bump silently broke coverage uploads ("Missing Head Commit"
      # on PRs). Keep codecov-action pinned until a deliberate, verified
      # migration — see the comment in .github/workflows/CI.yml.
      - dependency-name: "codecov/codecov-action"
        update-types: ["version-update:semver-major"]
